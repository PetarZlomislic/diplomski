defaults:
  - model: dummy
  - data: dummy
  - degradation: none
  - optim: adamw
  - trainer: default
  - _self_

seed: 0
degradation_seed: 12345      # deliberately independent of `seed`

# Multi-label decision threshold. The one place it is set; affects every reported metric.
threshold: 0.5

# Resolved at runtime from src/env.py — do NOT hardcode a path here.
output_dir: null
results_repo: null           # HF dataset repo ("user/name") for results rows; null = local only

resume_from_checkpoint: null # path to a .ckpt; continues that run in its own dir
ckpt_interval_min: 30        # wall-clock checkpoint interval (Kaggle has a 9 h hard cap)
stop_margin_min: 15          # stop this long before the runtime's wall-clock cap, then save

obs:
  heartbeat_s: 30            # TIME interval, not steps
  jsonl: true                # false: stdout only, no <run dir>/run.jsonl
  warn_data_wait_frac: 0.3

wandb:
  enabled: false             # default off; smoke test must not need network
  project: thesis
  mode: online               # forced to "offline" when the runtime has no internet

# Hydra's own per-run working dir (configs, .hydra/). Durable artifacts go under output_dir.
hydra:
  run:
    dir: hydra_runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra_runs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
