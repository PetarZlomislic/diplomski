# Experiment 1 degradation sweep of ONE trained run (python -m src.sweep_eval).
# Severity grids from the pre-analysis (§2.2, §8). The clean point (s=0) is NOT repeated:
# every training run already wrote its clean `none` row, and the analysis uses it as F1(0).
run_dir: ???
ckpt: best
stage: pilot                 # pilot | full
degradation_seed: 12345      # deliberately independent of the training seed
results_repo: null

grids:
  pilot:                     # Stage 1: reduced grid {0, .5, 1}
    cloud: [0.5, 1.0]
    speckle: [0.5, 1.0]
    drop_optical: [1.0]
    drop_sar: [1.0]
    temporal: [1, 8]
  full:                      # Stage 2
    cloud: [0.25, 0.5, 0.75, 1.0]
    speckle: [0.25, 0.5, 0.75, 1.0]
    drop_optical: [1.0]
    drop_sar: [1.0]
    temporal: [1, 2, 4, 8]

obs:
  heartbeat_s: 30
  jsonl: true

hydra:
  run:
    dir: hydra_runs/sweep-eval/${now:%Y-%m-%d}/${now:%H-%M-%S}
