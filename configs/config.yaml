defaults:
  - model: dummy
  - data: dummy
  - degradation: none
  - optim: adamw
  - trainer: default
  - _self_

seed: 0
degradation_seed: 12345      # deliberately independent of `seed`

# Multi-label decision threshold. The one place it is set; affects every reported metric.
threshold: 0.5

# Resolved at runtime from src/env.py — do NOT hardcode a path here.
output_dir: null

resume_from_checkpoint: null # path to a .ckpt; continues that run in its own dir
ckpt_interval_min: 30        # wall-clock checkpoint interval (Kaggle has a 9 h hard cap)

# Hydra's own per-run working dir (configs, .hydra/). Durable artifacts go under output_dir.
hydra:
  run:
    dir: hydra_runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra_runs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
