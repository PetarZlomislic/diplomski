# Streams shards written by `python -m src.prepare_data`. A relative data_uri resolves
# against the runtime data root (local: data/, Kaggle: /kaggle/input/, HF Jobs:
# hf://datasets/); absolute paths, ./paths, file:// and other URIs are used as given. E.g.
#   data=streaming data.data_uri=prepared/dev           (local -> data/prepared/dev)
#   data=streaming data.data_uri=<user>/reben-dev       (HF Jobs -> hf://datasets/<user>/reben-dev)
_target_: src.data.streaming.StreamingDataModule
data_uri: ???
num_classes: 19
in_channels:
  optical: 12
  sar: 2
image_size: 120
batch_size: 32
num_workers: 0
cache_dir: null
max_cache_size: 20GB         # litdata suggests >=25GB; Kaggle only has ~20GB of disk
seed: 0
