[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robustness-eval"
version = "0.1.0"
description = "Multimodal degradation robustness evaluation framework"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "lightning==2.6.6",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "torchmetrics==1.9.0",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "litdata==0.2.76",
    "huggingface-hub==2.1.1",
    "psutil==7.2.2",
    "nvidia-ml-py==13.615.71",
    "datasets==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]
logging = [
    "wandb==0.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: marks tests as heavy/slow (deselect with '-m \"not heavy\"')",
    "integration: marks tests as integration tests",
]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]

